<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vom Samen zum Wald</title>
    <meta name="description" content="Ein gemütliches Aufbauspiel: Vom kleinen Samen wächst ein ganzer Wald mit seinen Bewohnern." />
    <!-- Installierbare App (PWA): Manifest, Farben, Icons; Service Worker siehe src/ui/pwa.ts -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3f8f3a" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Samen zum Wald" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="scene">
        <canvas id="scene" role="application" aria-roledescription="Szene" aria-label="Dein Baum und seine Bewohner"></canvas>
        <div class="stage-banner" id="stage-banner" aria-live="polite"></div>
        <div class="scene-dock" id="scene-dock"></div>
        <!-- Hinweise: am Desktop über der Szene (über Stapel und Kamera-Knöpfen), mobil oben fest -->
        <div class="toast" id="toast" role="status" hidden></div>
      </section>
      <aside class="panel" id="panel">
        <h1 tabindex="-1">Vom Samen zum Wald</h1>
        <!-- Rückkehr-Bericht nach Abwesenheit (ui/return-report.ts), sonst verborgen -->
        <div id="return-report"></div>
        <div id="season"></div>
        <div id="help"></div>
        <div id="ecosystem"></div>
        <div id="journal"></div>
        <div id="daily"></div>
        <div id="bonuses"></div>
        <div id="care"></div>
        <div id="cycle"></div>
        <footer>
          <button type="button" class="link-button" id="reset">Spielstand löschen</button>
        </footer>
      </aside>
    </main>
    <div class="sr-only" id="live-status" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

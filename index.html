<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vom Samen zum Wald</title>
    <meta name="description" content="Ein gemütliches Aufbauspiel: Vom kleinen Samen wächst ein ganzer Wald mit seinen Bewohnern." />
    <!-- Installierbare App (PWA): Manifest, Farben, Icons; Service Worker siehe src/ui/pwa.ts -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Karton des Albums (--card in src/ui/album/tokens.css) -->
    <meta name="theme-color" content="#e9dfc9" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Samen zum Wald" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      Album-Gerüst (docs/ALBUM_UI.md, B.0 und D.1): src/ui/album/index.ts baut das Buch einmal
      auf und setzt es vor das Canvas – Kopf mit Umschlag-Knopf, Doppelseite bzw. Einzelseite
      mit Polaroid und Reitern, Ablage der Unterseiten, Umschlag. Das Szenen-Canvas wandert
      ins Polaroid (Vollbild: fullscreen.ts). Danach folgen die Stempelschicht (#stamps), die
      Statuszeile für Screenreader und die Ebene der schwebenden Zahlen.
    -->
    <noscript>
      <p style="margin: 2rem; font-family: system-ui, sans-serif">
        „Vom Samen zum Wald“ braucht JavaScript – bitte aktiviere es, damit dein Wald wachsen kann.
      </p>
    </noscript>
    <canvas id="scene" role="application" aria-roledescription="Szene" aria-label="Dein Baum und seine Bewohner"></canvas>
    <div class="sr-only" id="live-status" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

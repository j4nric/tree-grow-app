<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vom Samen zum Wald</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="scene">
        <canvas id="scene" role="application" aria-roledescription="Szene" aria-label="Dein Baum und seine Bewohner"></canvas>
        <div class="stage-banner" id="stage-banner" aria-live="polite"></div>
        <div class="scene-dock" id="scene-dock"></div>
      </section>
      <aside class="panel" id="panel">
        <h1 tabindex="-1">Vom Samen zum Wald</h1>
        <div id="season"></div>
        <div id="help"></div>
        <div id="ecosystem"></div>
        <div id="journal"></div>
        <div id="daily"></div>
        <div id="bonuses"></div>
        <div id="care"></div>
        <div id="cycle"></div>
        <footer>
          <button type="button" class="link-button" id="reset">Spielstand löschen</button>
        </footer>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="sr-only" id="live-status" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Pages

# Baut das Spiel bei jedem Push auf main und veröffentlicht es auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
# Optional für Konto und Gerätesync: Repository-Variable VITE_SYNC_URL mit der Adresse des
# eigenen Sync-Servers, z. B. https://203-0-113-5.sslip.io (Settings → Secrets and
# variables → Actions → Variables; Anleitung: docs/KONTO.md). Ohne sie kein Konto.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

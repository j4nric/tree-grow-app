name: CI

on:
  push:
    branches: [main, claude/ci-tempo] # TEMP-MESSUNG
  pull_request:

# Ein neuer Push auf denselben PR bricht den veralteten Lauf ab (spart Runner, keine Warteschlange).
# Auf main läuft jeder Commit zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm wartet sonst bis zu 5 min auf eine hängende Registry-Anfrage (fetch-timeout 300000) –
  # genau so lange hingen einzelne `npm ci` (300–420 s statt 2 s). Kürzer warten, öfter versuchen.
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retries: '4'
  npm_config_fetch_retry_mintimeout: '2000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # node_modules beider Pakete direkt cachen: Bei Treffer braucht es gar kein Netz.
      # Schlüssel = Lockfiles + Node-Version, also nie veraltete Pakete.
      - id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}
      # Ohne Audit/Fund: Der Audit-Aufruf geht immer ins Netz (nicht im Cache) und ist für den
      # Test-Lauf ohne Nutzen.
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Sync-Server (server/): eigene, kleine Abhängigkeiten (nur TypeScript + Node-Typen).
      # Seine Tests laufen in `npm run check` mit (Vitest des Spiels).
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix server --no-audit --no-fund
      - run: npm run check
      # TEMP-MESSUNG: Vergleich auf demselben Runner, Ergebnisse als Annotationen.
      - run: |
          m() { rm -rf node_modules/.vite/vitest; s=$(date +%s.%N); "${@:2}" > out.txt 2>&1; rc=$?; e=$(date +%s.%N); echo "::notice::$1 rc=$rc wall=$(echo "$e - $s" | bc) $(grep -E 'Duration' out.txt | tail -1)"; }
          m tsc npm run typecheck
          m branch-default-1 npx vitest run
          m branch-w4 npx vitest run --maxWorkers=4
          m branch-threads npx vitest run --pool=threads
          m branch-default-2 npx vitest run
          git fetch -q --depth=1 origin main
          git checkout FETCH_HEAD -- tests vite.config.ts
          rm -f tests/sync-harness.ts tests/sync-same4-*.test.ts
          m main-default-1 npx vitest run
          m main-w4 npx vitest run --maxWorkers=4
          m main-default-2 npx vitest run
      - run: npm run typecheck --prefix server
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Die Konto-e2e-Tests starten den Sync-Server (playwright.config.ts).
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix server --no-audit --no-fund
      # Chromium passend zur Playwright-Version (steht im Lockfile) cachen; die System-
      # Bibliotheken (apt) kommen nicht in den Cache und werden bei Treffer nur nachinstalliert.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

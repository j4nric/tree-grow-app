name: CI

on:
  push:
    branches: [main, claude/ci-tempo] # TEMP-MESSUNG
  pull_request:

# Ein neuer Push auf denselben PR bricht den veralteten Lauf ab (spart Runner, keine Warteschlange).
# Auf main läuft jeder Commit zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm wartet sonst bis zu 5 min auf eine hängende Registry-Anfrage (fetch-timeout 300000) –
  # genau so lange hingen einzelne `npm ci` (300–420 s statt 2 s). Kürzer warten, öfter versuchen.
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retries: '4'
  npm_config_fetch_retry_mintimeout: '2000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # node_modules beider Pakete direkt cachen: Bei Treffer braucht es gar kein Netz.
      # Schlüssel = Lockfiles + Node-Version, also nie veraltete Pakete.
      - id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}
      # Ohne Audit/Fund: Der Audit-Aufruf geht immer ins Netz (nicht im Cache) und ist für den
      # Test-Lauf ohne Nutzen.
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Sync-Server (server/): eigene, kleine Abhängigkeiten (nur TypeScript + Node-Typen).
      # Seine Tests laufen in `npm run check` mit (Vitest des Spiels).
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix server --no-audit --no-fund
      - run: npm run check
      # TEMP-MESSUNG: Dauern als Annotationen (Logs sind von außen nicht lesbar).
      - run: |
          echo "::notice::nproc=$(nproc) parallel=$(node -p 'require("os").availableParallelism()')"
          npx vitest run --reporter=json --outputFile=vt.json > /dev/null 2>&1 || true
          node -e '
            const r = require("./vt.json");
            const f = r.testResults.map((t) => [Math.round(t.endTime - t.startTime), t.name.replace(process.cwd() + "/", "")]).sort((a, b) => b[0] - a[0]);
            const t0 = Math.min(...r.testResults.map((t) => t.startTime)), t1 = Math.max(...r.testResults.map((t) => t.endTime));
            console.log(`::notice::wall=${Math.round(t1 - t0)} sum=${f.reduce((s, x) => s + x[0], 0)} files=${f.length}`);
            console.log(`::notice::top ${f.slice(0, 14).map((x) => x[1].split("/").pop() + "=" + x[0]).join(" ")}`);
            const s = r.testResults.map((t) => [Math.round(t.startTime - t0), Math.round(t.endTime - t0), t.name.split("/").pop()]).sort((a, b) => a[0] - b[0]);
            console.log(`::notice::start ${s.filter((x) => /sync|security/.test(x[2])).map((x) => x[2] + "@" + x[0] + "-" + x[1]).join(" ")}`);
          '
      - run: npm run typecheck --prefix server
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Die Konto-e2e-Tests starten den Sync-Server (playwright.config.ts).
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix server --no-audit --no-fund
      # Chromium passend zur Playwright-Version (steht im Lockfile) cachen; die System-
      # Bibliotheken (apt) kommen nicht in den Cache und werden bei Treffer nur nachinstalliert.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
